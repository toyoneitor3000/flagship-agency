<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background:#090A0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', serif;">
  <defs>
    <radialGradient id="authorBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0F1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="authorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#authorBg)"/>

  <!-- Precision Background Grid -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="0.5">
    <line x1="300" y1="0" x2="300" y2="600" stroke-dasharray="4,4"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke-dasharray="4,4"/>
    <circle cx="300" cy="300" r="280" fill="none"/>
    <circle cx="300" cy="300" r="250" fill="none"/>
  </g>

  <!-- Outer Technical Ring with Ticks -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="url(#goldRing)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Rotating/Circular Text Path -->
  <path id="textCircle" d="M 300, 300 m -205, 0 a 205,205 0 1,1 410,0 a 205,205 0 1,1 -410,0" fill="none"/>
  <text fill="#E2E8F0" font-size="11" font-family="monospace" letter-spacing="4" font-weight="700">
    <textPath href="#textCircle" startOffset="0%">
      CAMILO TOLOZA • FOUNDER &amp; CHIEF ARCHITECT • PURRPURR DIGITAL • BOGOTÁ • 
    </textPath>
  </text>

  <!-- Inner Concentric Frame -->
  <circle cx="300" cy="300" r="175" fill="#0C0E15" stroke="#1E293B" stroke-width="2"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="url(#emeraldRing)" stroke-width="1.2" stroke-dasharray="8,4" filter="url(#authorGlow)"/>

  <!-- Inner Aura -->
  <circle cx="300" cy="300" r="130" fill="#141824" stroke="#334155" stroke-width="1"/>

  <!-- Center Monogram "CT" in Refined Serif Typography -->
  <g transform="translate(300, 315)" text-anchor="middle">
    <!-- Subtle drop shadow -->
    <text x="3" y="3" fill="#030712" font-size="94" font-weight="900" font-family="'Times New Roman', Georgia, serif" letter-spacing="4">
      CT
    </text>
    <text x="0" y="0" fill="#FFFFFF" font-size="94" font-weight="900" font-family="'Times New Roman', Georgia, serif" letter-spacing="4">
      CT
    </text>
  </g>

  <!-- Subtitle beneath Monogram -->
  <text x="300" y="365" fill="#00FF9C" font-size="10.5" font-family="monospace" letter-spacing="3" text-anchor="middle" font-weight="700">
    INGENIERÍA &amp; DIRECCIÓN
  </text>

  <line x1="240" y1="380" x2="360" y2="380" stroke="#F59E0B" stroke-width="1"/>

  <text x="300" y="398" fill="#94A3B8" font-size="9" font-family="monospace" letter-spacing="2" text-anchor="middle">
    12+ AÑOS DE EXPERIENCIA
  </text>

  <!-- Precision Corner Badges -->
  <g opacity="0.7">
    <rect x="30" y="30" width="80" height="22" rx="3" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <text x="70" y="44" fill="#94A3B8" font-size="9" font-family="monospace" text-anchor="middle">AUTOR</text>

    <rect x="490" y="30" width="80" height="22" rx="3" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
    <text x="530" y="44" fill="#6EE7B7" font-size="9" font-family="monospace" text-anchor="middle">VERIFICADO</text>
  </g>
</svg>
